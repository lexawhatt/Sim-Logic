[package]
name = "sim-logic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A code-first application and logic layer for Sim;Engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexawhatt/Sim-Logic"

[features]
default = ["desktop"]
desktop = ["sim-engine/wgpu", "dep:winit", "dep:pollster"]
audio = ["dep:rodio"]
easter-eggs = ["dep:png"]
text = ["sim-engine/text"]

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std", "debug"] }
sim-engine = { version = "=0.3.0", default-features = false }
winit = { version = "=0.30.12", optional = true }
pollster = { version = "=1.0.1", optional = true }
rodio = { version = "=0.22.2", default-features = false, features = ["playback"], optional = true }
png = { version = "=0.18.1", default-features = false, optional = true }

[dev-dependencies]
rtrb = "=0.3.5"

# Keep local development and tests small; test inherits this profile.
# Override CARGO_PROFILE_DEV_DEBUG=2 for a full debugger session if needed.
[profile.dev]
debug = "line-tables-only"
incremental = false

